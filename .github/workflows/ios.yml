name: iOS build

# Compiles the iOS app on a macOS runner (unsigned, simulator SDK) to prove the Xcode project,
# Swift code and Swift packages build — there is no Mac locally. Device builds need signing
# with an Apple account and are made from Xcode.
on:
  push:
    paths:
      - 'ios/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package*.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ios:sync
      - name: xcodebuild (simulator, unsigned)
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -40
          test -d build/Build/Products/Debug-iphonesimulator/App.app
          plutil -p build/Build/Products/Debug-iphonesimulator/App.app/Info.plist | grep -A3 BGTaskScheduler
          test -f build/Build/Products/Debug-iphonesimulator/App.app/public/runners/aurora.js
