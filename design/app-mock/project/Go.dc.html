<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Where to go</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#04070f}
a{color:#5cffb0;text-decoration:none}a:hover{color:#a9ffd6}
.card{background:rgba(14,22,40,.72);border:1px solid rgba(160,220,255,.12);border-radius:20px;padding:16px}
.eyebrow{font:500 11px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#93a3bc}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;background:rgba(6,10,20,.92);border-top:1px solid rgba(160,220,255,.10)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;min-height:44px;font:500 11px/1 Inter,sans-serif;color:#93a3bc}
.tab.on{color:#5cffb0}
.tab svg{width:24px;height:24px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(160,220,255,.16);background:rgba(14,22,40,.8);color:#c9d6ea;font:500 13px Inter,sans-serif}
.chip.on{background:#5cffb0;color:#04120b;border-color:#5cffb0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#04070f;color:#e8f1ff;font:15px/1.45 Inter,sans-serif">

  <svg role="img" aria-label="Map around Stavanger: cloud over the coast, clear sky inland to the north-east, five spots with tonight's score" viewBox="0 0 390 420" style="position:absolute;left:0;top:0;width:390px;height:420px">
    <defs>
      <radialGradient id="clear" cx="70%" cy="35%" r="45%"><stop offset="0" stop-color="#5cffb0" stop-opacity=".28"></stop><stop offset="1" stop-color="#5cffb0" stop-opacity="0"></stop></radialGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="14"></feGaussianBlur></filter>
    </defs>
    <rect width="390" height="420" fill="#081120"></rect>
    <path d="M0 0 H150 C140 40 170 60 150 95 C130 120 160 150 140 185 C120 220 150 250 120 290 C100 320 120 360 90 420 H0 Z" fill="#0b1a2e"></path>
    <path d="M150 0 H390 V420 H90 C120 360 100 320 120 290 C150 250 120 220 140 185 C160 150 130 120 150 95 C170 60 140 40 150 0 Z" fill="#111d2f"></path>
    <path d="M190 120 C230 140 250 110 300 130 C330 140 350 120 390 135" stroke="#0b1a2e" stroke-width="10" fill="none"></path>
    <path d="M210 200 C240 215 270 190 320 210 C350 222 370 205 390 215" stroke="#0b1a2e" stroke-width="7" fill="none"></path>
    <rect width="390" height="420" fill="url(#clear)"></rect>
    <g filter="url(#blur)" fill="#9fb0c8" opacity=".35">
      <ellipse cx="90" cy="250" rx="110" ry="70"></ellipse>
      <ellipse cx="60" cy="110" rx="80" ry="60"></ellipse>
      <ellipse cx="180" cy="360" rx="120" ry="50"></ellipse>
    </g>
    <circle cx="150" cy="265" r="135" fill="none" stroke="#5cffb0" stroke-opacity=".35" stroke-dasharray="4 6"></circle>
    <text x="210" y="398" fill="#8fe9bf" font-size="11" font-family="Inter">1 h drive</text>
    <g font-family="Space Grotesk" font-weight="700" font-size="13" text-anchor="middle">
      <circle cx="262" cy="150" r="17" fill="#5cffb0"></circle><text x="262" y="155" fill="#04120b">71</text>
      <circle cx="225" cy="190" r="17" fill="#5cffb0"></circle><text x="225" y="195" fill="#04120b">64</text>
      <circle cx="300" cy="245" r="15" fill="#ffc56b"></circle><text x="300" y="250" fill="#1a1204">47</text>
      <circle cx="105" cy="300" r="15" fill="#3a4d6b"></circle><text x="105" y="305" fill="#e8f1ff">18</text>
      <circle cx="70" cy="215" r="15" fill="#3a4d6b"></circle><text x="70" y="220" fill="#e8f1ff">22</text>
    </g>
    <circle cx="150" cy="265" r="7" fill="#e8f1ff" stroke="#04070f" stroke-width="3"></circle>
    <text x="162" y="282" fill="#e8f1ff" font-size="11" font-family="Inter">You · 31</text>
    <g transform="translate(352 26)" font-family="Inter" font-size="11" fill="#e8f1ff" text-anchor="middle"><path d="M0 -10 L6 6 L0 2 L-6 6 Z" fill="#e8f1ff"></path><text y="20">N</text></g>
  </svg>

  <div style="position:absolute;left:16px;right:16px;top:16px;display:flex;gap:8px">
    <button class="chip">≤ 30 min</button>
    <button class="chip on">≤ 1 h</button>
    <button class="chip">≤ 2 h</button>
  </div>

  <div style="position:absolute;left:0;right:0;top:396px;bottom:84px;background:#04070f;border-radius:24px 24px 0 0;border-top:1px solid rgba(160,220,255,.12);padding:10px 16px 16px;box-sizing:border-box;overflow-y:auto;display:flex;flex-direction:column;gap:10px">
    <div aria-hidden="true" style="width:40px;height:4px;border-radius:2px;background:#3a4d6b;align-self:center"></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <h1 style="margin:0;font:600 18px/1.2 'Space Grotesk',sans-serif">Best within 1 h, 22:30–00:30</h1>
    </div>
    <div style="font-size:13px;color:#93a3bc;margin-top:-4px">Cloud clears inland. Coast stays covered until 02:00.</div>
    <sc-for list="{{spots}}" as="s" hint-placeholder-count="4">
      <a href="Spot.dc.html" class="card" style="display:flex;align-items:center;gap:12px;padding:12px;color:#e8f1ff">
        <div style="{{s.badge}}">{{s.score}}</div>
        <div style="flex:1;min-width:0">
          <div style="font:600 15px/1.3 'Space Grotesk',sans-serif">{{s.name}}</div>
          <div style="font-size:12px;color:#93a3bc">{{s.meta}}</div>
        </div>
        <div style="font-size:13px;color:#c9d6ea;text-align:right">{{s.drive}}</div>
      </a>
    </sc-for>
  </div>

  <nav class="tabbar" aria-label="Main">
    <a class="tab" href="Main.dc.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"></path></svg>Tonight</a>
    <a class="tab on" href="Go.dc.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-8-8 18-2-8z"></path></svg>Where to go</a>
    <a class="tab" href="Alerts.dc.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg>Alerts</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      ['71', 'Lysefjord ridge', 'clear 90 % · open north · very dark', '55 min'],
      ['64', 'Dalsnuten viewpoint', 'clear 85 % · open north · dark', '35 min'],
      ['47', 'Gjesdal lake', 'clear 60 % · trees to north', '30 min'],
      ['22', 'Sola beach', 'cloud 80 % · open sea north-west', '20 min']
    ];
    var spots = rows.map(function (r) {
      var v = +r[0];
      var bg = v >= 50 ? '#5cffb0' : v >= 30 ? '#ffc56b' : '#3a4d6b';
      var fg = v >= 30 ? '#04120b' : '#e8f1ff';
      return { score: r[0], name: r[1], meta: r[2], drive: r[3],
        badge: 'width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 18px Space Grotesk,sans-serif;background:' + bg + ';color:' + fg };
    });
    return { spots: spots };
  }
}
</script>
</body>
</html>
