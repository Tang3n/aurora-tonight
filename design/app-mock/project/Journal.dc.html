<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journal and alerts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#04070f}
a{color:#5cffb0;text-decoration:none}a:hover{color:#a9ffd6}
.card{background:rgba(14,22,40,.72);border:1px solid rgba(160,220,255,.12);border-radius:20px;padding:16px}
.eyebrow{font:500 11px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#93a3bc}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;background:rgba(6,10,20,.92);border-top:1px solid rgba(160,220,255,.10)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;min-height:44px;font:500 11px/1 Inter,sans-serif;color:#93a3bc}
.tab.on{color:#5cffb0}
.tab svg{width:24px;height:24px}
.fab{width:52px;height:52px;margin-top:-18px;border-radius:50%;background:#5cffb0;color:#04120b;display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(92,255,176,.45)}
.row{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid rgba(160,220,255,.08)}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#04070f;color:#e8f1ff;font:15px/1.45 Inter,sans-serif">
  <div style="height:760px;overflow-y:auto;padding:16px 16px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:12px">
      <div aria-hidden="true" style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#39d0ff,#5cffb0);display:flex;align-items:center;justify-content:center;color:#04120b;font:700 18px 'Space Grotesk',sans-serif">S</div>
      <div style="flex:1"><h1 style="margin:0;font:600 20px 'Space Grotesk',sans-serif">Your nights</h1><div style="font-size:13px;color:#93a3bc">@you · season 2026/27</div></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <div class="card" style="padding:12px"><div class="eyebrow">Nights out</div><div style="font:700 28px 'Space Grotesk',sans-serif;margin-top:6px">14</div></div>
      <div class="card" style="padding:12px"><div class="eyebrow">Worth it</div><div style="font:700 28px 'Space Grotesk',sans-serif;margin-top:6px;color:#5cffb0">9</div></div>
      <div class="card" style="padding:12px"><div class="eyebrow">Photos</div><div style="font:700 28px 'Space Grotesk',sans-serif;margin-top:6px">23</div></div>
    </div>

    <div class="card" style="padding:4px 16px">
      <sc-for list="{{nights}}" as="n" hint-placeholder-count="4">
        <div class="row">
          <span aria-hidden="true" style="{{n.dot}}"></span>
          <div style="flex:1;font-size:14px">{{n.title}}<div style="font-size:12px;color:#93a3bc">{{n.sub}}</div></div>
          <div style="font-size:12px;color:#93a3bc">fc {{n.fc}}</div>
        </div>
      </sc-for>
    </div>

    <h2 style="margin:8px 0 0;font:600 17px 'Space Grotesk',sans-serif">Alerts</h2>
    <div class="card" style="padding:4px 16px">
      <sc-for list="{{alerts}}" as="a" hint-placeholder-count="3">
        <div class="row">
          <div style="flex:1;font-size:14px">{{a.title}}<div style="font-size:12px;color:#93a3bc">{{a.sub}}</div></div>
          <button role="switch" aria-checked="{{a.aria}}" aria-label="{{a.title}}" onClick="{{a.toggle}}" style="{{a.track}}"><span style="{{a.knob}}"></span></button>
        </div>
      </sc-for>
      <div class="row" style="border-bottom:0">
        <div style="flex:1;font-size:14px">Quiet hours<div style="font-size:12px;color:#93a3bc">No alerts 02:00–07:00 on work nights</div></div>
        <span style="font-size:14px;color:#c9d6ea">Edit</span>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:4px">
      <a href="Scorecard.dc.html" style="min-height:44px;display:flex;align-items:center">How accurate are we?</a>
      <button style="min-height:44px;background:none;border:0;color:#ff9aa6;font:500 13px Inter,sans-serif">Delete account and data</button>
    </div>
  </div>

  <nav class="tabbar" aria-label="Main">
    <a class="tab" href="Main.dc.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"></path></svg>Tonight</a>
    <a class="tab" href="Go.dc.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-8-8 18-2-8z"></path></svg>Go</a>
    <a class="tab" href="Report.dc.html" aria-label="Report a sighting"><span class="fab"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"></path></svg></span></a>
    <a class="tab on" href="Journal.dc.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"></path><path d="M8 7h7"></path></svg>Journal</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { score: true, nearby: true, photos: false };
  }
  renderVals() {
    var self = this;
    var nights = [
      ['Seen with the eye · Dalsnuten', '12 Nov · 4 photos', '58', '#5cffb0'],
      ['Camera only · Sola beach', '9 Nov · 2 photos', '44', '#39d0ff'],
      ['Nothing, clouded in', '5 Nov', '39', '#3a4d6b'],
      ['Seen with the eye · Lysefjord ridge', '3 Nov · 6 photos', '72', '#5cffb0']
    ].map(function (n) {
      return { title: n[0], sub: n[1], fc: n[2], dot: 'width:10px;height:10px;border-radius:50%;flex:none;background:' + n[3] };
    });
    var defs = [
      ['score', 'Good night within 1 h drive', 'When any saved spot reaches 50'],
      ['nearby', 'Sightings within 50 km', 'When 2+ people report in 30 min'],
      ['photos', 'Only reports with photos', 'Ignore text-only reports']
    ];
    var alerts = defs.map(function (d) {
      var on = self.state[d[0]];
      return { title: d[1], sub: d[2], aria: on ? 'true' : 'false',
        track: 'width:52px;height:32px;border-radius:999px;border:0;padding:3px;cursor:pointer;display:flex;flex:none;justify-content:' + (on ? 'flex-end' : 'flex-start') + ';background:' + (on ? '#5cffb0' : '#2a3850'),
        knob: 'width:26px;height:26px;border-radius:50%;background:' + (on ? '#04120b' : '#93a3bc'),
        toggle: function () { var n = {}; n[d[0]] = !self.state[d[0]]; self.setState(n); } };
    });
    return { nights: nights, alerts: alerts };
  }
}
</script>
</body>
</html>
