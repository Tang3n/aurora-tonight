<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurora Tonight</title>
  <meta name="description" content="Should you go outside tonight to see the northern lights? One answer for your location, with the reasons behind it.">
  <meta name="theme-color" content="#04070f">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Aurora Tonight">
  <meta property="og:description" content="Should you go outside tonight to see the northern lights? One answer for your location, with the reasons behind it.">
  <meta property="og:url" content="https://tang3n.github.io/aurora-tonight/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='0' y2='0'%3E%3Cstop offset='0' stop-color='%235cffb0'/%3E%3Cstop offset='1' stop-color='%23b48cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='%2304070f'/%3E%3Cpath d='M5 22c4-9 8-12 11-12s7 3 11 12' fill='none' stroke='url(%23g)' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://services.swpc.noaa.gov" crossorigin>
  <link rel="preconnect" href="https://api.met.no" crossorigin>
</head>
<body class="loading">
  <canvas id="sky" aria-hidden="true"></canvas>
  <svg class="ridge" viewBox="0 0 1440 220" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050912"/><stop offset="1" stop-color="#02040a"/></linearGradient></defs>
    <path fill="#071020" opacity=".9" d="M0 150 L80 120 L170 138 L260 96 L330 112 L420 70 L470 86 L540 60 L610 98 L700 84 L790 118 L880 92 L960 110 L1040 74 L1120 96 L1200 64 L1290 100 L1370 88 L1440 110 L1440 220 L0 220Z"/>
    <path fill="url(#rg)" d="M0 180 L120 150 L210 166 L300 128 L380 150 L460 120 L560 158 L650 140 L740 166 L860 136 L960 160 L1060 128 L1160 156 L1260 134 L1360 160 L1440 146 L1440 220 L0 220Z"/>
  </svg>

  <div class="wrap">
    <header>
      <div class="brand"><span class="mark"></span>Aurora Tonight</div>
      <div class="loc">
        <button class="pill" id="locBtn" aria-haspopup="dialog" aria-expanded="false"></button>
        <div class="popover" id="pop" role="dialog" hidden>
          <input id="q" type="search" autocomplete="off" spellcheck="false">
          <ul id="results"></ul>
          <button class="geo" id="geo" type="button"></button>
        </div>
      </div>
      <div class="lang" role="group" aria-label="Language" id="lang"></div>
    </header>

    <main>
      <section class="hero">
        <div class="card" id="verdict" aria-live="polite"></div>
        <div class="card map">
          <div class="map-head">
            <div class="eyebrow" id="ovalTitle"></div>
            <div class="legend" style="width:120px"><span id="lgLow"></span><span class="bar"></span><span id="lgHigh"></span></div>
          </div>
          <canvas id="oval" width="800" height="800" role="img"></canvas>
        </div>
      </section>

      <div id="notice" class="notice" hidden></div>

      <section class="card section" id="timeline"></section>
      <section class="factors section" id="factors"></section>

      <section class="split section">
        <div class="card" id="space"></div>
        <div class="card" id="nights"></div>
      </section>
    </main>

    <footer id="footer"></footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
